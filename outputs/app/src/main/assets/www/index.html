<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>修仙</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;background:#fff;color:#444;display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;touch-action:manipulation;position:relative}
.page{display:none;width:100%;flex:1;overflow-y:auto}.page.active{display:flex;flex-direction:column;align-items:center}
.container{width:100%;max-width:420px;height:100%;display:flex;flex-direction:column;align-items:center;padding:0 24px}
.top-bar{width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px 0 8px;font-size:13px;color:#999}
.top-bar .val{color:#555;font-weight:600}
.stage-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;width:100%}
.realm-name{font-size:36px;font-weight:700;color:#444;letter-spacing:4px}
.progress-section{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
.progress-text{font-size:13px;color:#999}.progress-text .pct{color:#555;font-weight:700;font-size:15px;margin:0 2px}
.progress-bar-outer{width:100%;height:6px;border-radius:3px;background:#eee;overflow:hidden}
.progress-bar-inner{height:100%;border-radius:3px;background:#bbb}
.action-area{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px 0 16px}
.btn{height:48px;border:none;border-radius:6px;font-size:16px;font-weight:600;letter-spacing:2px;cursor:pointer;background:#f0f0f0;color:#555;border:1px solid #ddd}
.btn-sm{height:38px;font-size:14px;letter-spacing:1px}.btn.active{background:#e8e8e8;color:#888}
.btn-wide{width:100%;max-width:260px}.btn-break{display:none;background:#d5d5d5;color:#333}.btn-break.show{display:block}
.speed-info{font-size:12px;color:#aaa;letter-spacing:1px}
.tab-bar{width:100%;max-width:420px;display:flex;border-top:1px solid #eee;flex-shrink:0}
.tab-btn{flex:1;height:48px;border:none;background:#fff;font-size:12px;color:#aaa;cursor:pointer;border-bottom:2px solid transparent;padding:0 2px}
.tab-btn.active{color:#555;border-bottom-color:#555}
.travel-wrap{width:100%;padding:0 24px;display:flex;flex-direction:column;flex:1}
.travel-section{width:100%;padding:16px 0}.travel-section-title{font-size:14px;color:#999;margin-bottom:12px}
.dest-list{display:flex;flex-wrap:wrap;gap:8px}
.dest-item{padding:8px 20px;border-radius:6px;border:1px solid #ddd;background:#f8f8f8;font-size:14px;color:#555;cursor:pointer}
.dest-item.selected{background:#e8e8e8;border-color:#bbb}
.travel-lower{flex:1;display:flex;flex-direction:column;width:100%}
.travel-content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}
.travel-btns{width:100%;display:flex;gap:8px;justify-content:center;padding:8px 0 4px;flex-shrink:0}
.travel-btns .travel-btn{min-width:72px}
.travel-confirm-text{font-size:15px;color:#555;margin-bottom:16px}
#btnAccount{position:fixed;right:16px;bottom:56px;z-index:99999;width:48px;height:48px;border-radius:50%;background:#4CAF50;color:#fff;font-size:14px;font-weight:600;border:none;box-shadow:0 3px 12px rgba(0,0,0,0.4);cursor:pointer;display:flex;align-items:center;justify-content:center}
.travel-btn{height:42px;padding:0 20px;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;background:#f0f0f0;color:#555;border:1px solid #ddd}
.travel-info{font-size:13px;color:#999;margin-bottom:12px;text-align:center}
.travel-info .val{color:#555;font-weight:600}
.travel-text-area{min-height:48px;text-align:center;margin-bottom:12px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.travel-text-area .line{font-size:13px;color:#888;line-height:1.8}
.combat-panel{display:flex;justify-content:space-between;width:100%;margin-bottom:12px;font-size:12px;color:#999}
.combat-side .val{color:#555;font-weight:600}
.combat-dmg-wrap{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}
.combat-dmg-lines{display:flex;flex-direction:column;align-items:center;font-size:13px;color:#888;line-height:1.8}
.repeat-badge{font-size:12px;color:#aaa;font-weight:600;white-space:nowrap}
.travel-end-msg{font-size:14px;color:#999;margin-top:8px}
#notifArea{position:fixed;top:12px;right:12px;z-index:900;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.notif{background:#fafafa;border:1px solid #e8e8e8;border-radius:6px;padding:6px 10px;font-size:12px;color:#666;display:inline-flex;align-items:center;gap:3px;opacity:1;transition:opacity .3s;align-self:flex-end}
.notif.fade-out{opacity:0}.notif .base{font-weight:600;color:#555}
.notif .delta{display:inline-block;margin-left:3px}
.notif .delta.red{color:#c0392b;font-weight:600}.notif .delta.green{color:#27ae60;font-weight:600}
.page-wrap{width:100%;max-width:420px;padding:0 16px;display:flex;flex-direction:column;flex:1;overflow-y:auto}
.section-title{font-size:14px;color:#999;margin:12px 0 8px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{min-height:40px;aspect-ratio:1;border:1px solid #ddd;border-radius:4px;background:#fafafa;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:#888;cursor:pointer;position:relative;word-break:break-all;text-align:center;padding:2px}
.slot.locked{background:#eee;pointer-events:none}.slot.has-item{background:#f4f4f4}.slot .count{position:absolute;bottom:2px;right:4px;font-size:10px;color:#aaa}
.divider{width:100%;border:none;border-top:1px solid #ddd;margin:12px 0}
#modalOverlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.3);z-index:800;align-items:center;justify-content:center}
#modalOverlay.show{display:flex}
.modal-box{background:#fff;border-radius:8px;padding:20px;max-width:300px;width:90%;display:flex;flex-direction:column;gap:10px}
.modal-name{font-size:16px;font-weight:700;color:#444}.modal-desc{font-size:13px;color:#888}
.modal-meta{font-size:12px;color:#aaa}
.modal-btns{display:flex;gap:8px;margin-top:4px}.modal-btns .btn{flex:1}
.profile-wrap{width:100%;max-width:420px;padding:0 16px;display:flex;flex-direction:column;flex:1;overflow-y:auto}
.attr-title{font-size:14px;color:#999;margin-bottom:12px}
.attr-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:14px}
.attr-label{color:#888}.attr-val{color:#555;font-weight:600}
.shop-header{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 0 8px;font-size:13px;color:#999}
.shop-header .val{color:#555;font-weight:600}
.craft-wrap{width:100%;max-width:420px;padding:0 16px;display:flex;flex-direction:column;flex:1;overflow-y:auto}
.craft-tabs{display:flex;border-bottom:1px solid #eee;margin-bottom:12px}
.craft-tab{flex:1;height:40px;border:none;background:#fff;font-size:13px;color:#aaa;cursor:pointer;border-bottom:2px solid transparent}
.craft-tab.active{color:#555;border-bottom-color:#555}
.recipe-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f0f0f0}
.recipe-slot{width:48px;height:48px;border:1px solid #ddd;border-radius:4px;background:#fafafa;display:flex;align-items:center;justify-content:center;font-size:10px;color:#888;text-align:center;word-break:break-all;padding:2px}
.recipe-info{flex:1;font-size:12px;color:#666}.recipe-info .mat{color:#999}.recipe-info .count{color:#aaa;font-size:11px}
.recipe-btn{height:32px;padding:0 12px;border:none;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;background:#f0f0f0;color:#555;border:1px solid #ddd}
.recipe-btn:disabled{opacity:0.4;cursor:not-allowed}
.craft-empty{font-size:13px;color:#ccc;text-align:center;padding:40px 0}
.codex-gold{border:2px solid #c9a96e !important}
.codex-black{border:2px solid #333 !important}
.codex-enchanted{box-shadow:0 0 0 2px #4a9eff}
.shop-refresh{display:flex;flex-direction:column;align-items:center;gap:4px;margin-left:auto}.shop-refresh-timer{font-size:12px;color:#999;letter-spacing:1px}.shop-refresh-btn{min-width:72px}.shop-refresh-cost{font-size:11px;color:#aaa}.shop-grid{grid-template-columns:repeat(3,1fr) !important}
.craft-level-bar{width:100%;max-width:420px;padding:10px 16px;border-top:1px solid #eee;background:#fff;font-size:13px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;position:sticky;bottom:0;z-index:10}
.travel-event-btn{display:block;margin-left:auto;margin-right:8px;height:22px;padding:0 10px;border:none;border-radius:4px;font-size:11px;background:#f0f0f0;color:#888;cursor:pointer;border:1px solid #ddd}
.attr-row{cursor:pointer}
.modal-scroll{max-height:60vh;overflow-y:auto;padding:0 2px}
.detail-cat{margin-bottom:8px}
.detail-cat-head{font-size:13px;font-weight:600;color:#555;cursor:pointer;padding:4px 0;border-bottom:1px solid #eee}
.detail-cat-items{padding:4px 0 4px 12px;font-size:12px;color:#888;display:none}
.detail-cat-items.open{display:block}
.detail-item{padding:2px 0}
.craft-level-tip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#333;color:#fff;font-size:11px;padding:4px 8px;border-radius:4px;white-space:nowrap;pointer-events:none;margin-bottom:4px}
.craft-level-bar{position:relative}
</style>
</head>
<body>
<div id="notifArea"></div>
<div id="modalOverlay"><div class="modal-box" id="modalBox"></div></div>
<div class="page active" id="pageMain"><div class="container"><div class="top-bar"><div><span class="label">境界 </span><span class="val" id="stageNum">练气一层</span></div><div id="stateIndicator" style="font-size:12px;color:#4CAF50;font-weight:600"></div><div><span class="label">修为 </span><span class="val" id="topExp">0</span></div></div><div class="stage-area"><div class="realm-name" id="realmName">练气一层</div><div class="progress-section"><div class="progress-text">距离突破还需 <span class="pct" id="pctText">0%</span> <span class="exp" id="expText">(0 / 100)</span></div><div class="progress-bar-outer"><div class="progress-bar-inner" id="progressBar" style="width:0%"></div></div></div></div><div class="action-area"><div class="speed-info" id="speedInfo">待修炼</div><div style="position:relative;width:100%;max-width:260px;margin:0 auto"><button class="btn btn-sm" id="btnFacility" style="position:absolute;right:-52px;top:0;min-width:48px;display:none">设施</button>
<button class="btn btn-sm" id="btnArray" style="position:absolute;left:-52px;top:0;min-width:48px">阵法</button><button class="btn btn-wide btn-break show" id="btnCultivate">修 炼</button></div><button class="btn btn-wide btn-break" id="btnBreak">突 破</button><button class="btn btn-sm" id="btnDebug" style="margin-top:8px;font-size:11px;opacity:0.5">开发者调试</button></div></div></div>
<div class="page" id="pageTravel"><div class="travel-wrap"><div class="travel-section"><div class="travel-section-title">选择目的地</div><div class="dest-list" id="destList"></div></div><div class="travel-lower" id="travelLower"></div></div></div>
<div class="page" id="pageStorage"><div class="page-wrap" id="storageWrap"></div></div>
<div class="page" id="pageShop"><div class="page-wrap" id="shopWrap"></div></div>
<div class="page" id="pageCraft"><div class="craft-wrap" id="craftWrap"></div><div class="craft-level-bar" id="craftLevelBar"></div></div>
<div class="page" id="pageBodyTrain"><div class="craft-wrap" id="bodyTrainWrap"></div></div>
<div class="page" id="pageProfile"><div class="profile-wrap"><div class="craft-tabs" id="infoTabs"><button class="craft-tab active" data-tab="attr">属性</button><button class="craft-tab" data-tab="stats">统计</button><button class="craft-tab" data-tab="codex">图鉴</button><button class="craft-tab" data-tab="skills">技能天赋</button></div><div id="infoContent"></div></div></div>
<div class="tab-bar"><button class="tab-btn active" data-page="pageMain">主界面</button><button class="tab-btn" data-page="pageTravel">游历</button><button class="tab-btn" data-page="pageStorage">存储</button><button class="tab-btn" data-page="pageShop">商店</button><button class="tab-btn" data-page="pageCraft">制作</button><button class="tab-btn" data-page="pageBodyTrain">练体</button><button class="tab-btn" data-page="pageProfile">信息</button></div>
<button id="btnAccount">账号</button>
<script>
(function(){
  var localSrc='game.js';
  var cacheKey='game_js_cache';
  var APP_VERSION='0.2.3';
  var REMOTE_BASES=['https://cdn.jsdelivr.net/gh/YunXi-0/XiImmortalDiary@main/outputs/'];

  function loadScript(src,onOk,onError){
    var s=document.createElement('script');
    s.src=src;
    s.onload=function(){if(onOk)onOk();};
    s.onerror=onError||function(){};
    document.body.appendChild(s);
  }

  function tryFetchFromBases(path,cb,idx){
    if(!idx)idx=0;
    if(idx>=REMOTE_BASES.length){cb(null);return;}
    var xhr=new XMLHttpRequest();
    xhr.open('GET',REMOTE_BASES[idx]+path+'?_t='+Date.now(),true);
    xhr.timeout=4000;
    xhr.onreadystatechange=function(){if(xhr.readyState===4){if(xhr.status===200&&xhr.responseText.length>0)cb(xhr.responseText);else tryFetchFromBases(path,cb,idx+1);}};
    xhr.onerror=function(){tryFetchFromBases(path,cb,idx+1);};
    xhr.send();
  }

  function showRestartTip(){
    var overlay=document.createElement('div');
    overlay.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:10000;display:flex;align-items:center;justify-content:center';
    overlay.innerHTML='<div style="background:#fff;border-radius:12px;padding:24px;max-width:300px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,0.3)"><div style="font-size:16px;font-weight:600;color:#444;margin-bottom:12px">游戏已更新</div><div style="font-size:13px;color:#888;margin-bottom:20px">新内容已加载，请重启游戏以应用更新</div><button id="restartBtn" style="width:100%;padding:10px;border:none;border-radius:6px;background:#4CAF50;color:#fff;font-size:15px;font-weight:600;cursor:pointer">确定</button></div>';
    document.body.appendChild(overlay);
    document.getElementById('restartBtn').addEventListener('click',function(){overlay.remove();location.reload();});
  }

  function showAPKUpdateTip(remoteVersion,apkUrl){
    var overlay=document.createElement('div');
    overlay.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:10000;display:flex;align-items:center;justify-content:center';
    overlay.innerHTML='<div style="background:#fff;border-radius:12px;padding:24px;max-width:300px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,0.3)"><div style="font-size:16px;font-weight:600;color:#444;margin-bottom:12px">发现新版本</div><div style="font-size:13px;color:#888;margin-bottom:8px">当前版本：v'+APP_VERSION+'</div><div style="font-size:13px;color:#888;margin-bottom:20px">最新版本：v'+remoteVersion+'</div><div style="display:flex;gap:10px"><button id="cancelUpdate" style="flex:1;padding:10px;border:1px solid #ddd;border-radius:6px;background:#fff;color:#888;font-size:14px;cursor:pointer">取消</button><button id="doUpdate" style="flex:1;padding:10px;border:none;border-radius:6px;background:#4CAF50;color:#fff;font-size:14px;font-weight:600;cursor:pointer">更新</button></div></div>';
    document.body.appendChild(overlay);
    document.getElementById('cancelUpdate').addEventListener('click',function(){overlay.remove();});
    document.getElementById('doUpdate').addEventListener('click',function(){overlay.remove();window.location.href=apkUrl;});
  }

  function checkRemoteVersion(){
    tryFetchFromBases('version.txt',function(text){
      if(text){
        var remoteVersion=text.trim();
        if(remoteVersion&&remoteVersion!==APP_VERSION){
          var apkUrl='https://github.com/YunXi-0/XiImmortalDiary/releases/latest/download/app-release-unsigned.apk';
          showAPKUpdateTip(remoteVersion,apkUrl);
        }
      }
    });
  }

  function tryUpdateAndLoad(){
    tryFetchFromBases('game.js',function(text){
      if(text&&text.length>1000){
        var cached=null;try{cached=localStorage.getItem(cacheKey);}catch(e){}
        var isNew=!cached||cached!==text;
        try{localStorage.setItem(cacheKey,text);}catch(e){}
        var blob=new Blob([text],{type:'application/javascript'});
        var url=URL.createObjectURL(blob);
        loadScript(url,function(){bindAccountBtn();loadScript(localSrc,function(){bindAccountBtn();});});
        if(isNew)setTimeout(showRestartTip,2000);
      }else{
        loadFromCacheOrLocal();
      }
    });
  }

  function loadFromCacheOrLocal(){
    var cached=null;
    try{cached=localStorage.getItem(cacheKey);}catch(e){}
    if(cached&&cached.length>1000){
      var blob=new Blob([cached],{type:'application/javascript'});
      var url=URL.createObjectURL(blob);
      loadScript(url,function(){bindAccountBtn();loadScript(localSrc,function(){bindAccountBtn();});});
    }else{
      loadScript(localSrc,function(){bindAccountBtn();});
    }
  }

  function bindAccountBtn(){var _accBtn=document.getElementById("btnAccount");if(_accBtn&&!_accBtn._bound){_accBtn._bound=true;_accBtn.addEventListener("click",function(){if(typeof showAccountModal==='function')showAccountModal();else if(typeof showTip==='function')showTip('加载中，请稍候...');});}}
  tryUpdateAndLoad();
  setTimeout(checkRemoteVersion,3000);
  setTimeout(bindAccountBtn,1000);setTimeout(bindAccountBtn,3000);setTimeout(bindAccountBtn,5000);
})();
</script>
</body>
</html>
