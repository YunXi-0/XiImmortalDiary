<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>修仙</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;background:#fff;color:#444;display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.page{display:none;width:100%;flex:1;overflow-y:auto}
.page.active{display:flex;flex-direction:column;align-items:center}
.container{width:100%;max-width:420px;height:100%;display:flex;flex-direction:column;align-items:center;padding:0 24px}
.top-bar{width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px 0 8px;font-size:13px;color:#999}
.top-bar .val{color:#555;font-weight:600}
.stage-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;width:100%}
.realm-name{font-size:36px;font-weight:700;color:#444;letter-spacing:4px}
.progress-section{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
.progress-text{font-size:13px;color:#999}
.progress-text .pct{color:#555;font-weight:700;font-size:15px;margin:0 2px}
.progress-bar-outer{width:100%;height:6px;border-radius:3px;background:#eee;overflow:hidden}
.progress-bar-inner{height:100%;border-radius:3px;background:#bbb}
.action-area{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px 0 16px}
.btn{height:48px;border:none;border-radius:6px;font-size:16px;font-weight:600;letter-spacing:2px;cursor:pointer;background:#f0f0f0;color:#555;border:1px solid #ddd}
.btn-sm{height:38px;font-size:14px;letter-spacing:1px}
.btn.active{background:#e8e8e8;color:#888}
.btn-wide{width:100%;max-width:260px}
.btn-break{display:none;background:#d5d5d5;color:#333}
.btn-break.show{display:block}
.speed-info{font-size:12px;color:#aaa;letter-spacing:1px}
.tab-bar{width:100%;max-width:420px;display:flex;border-top:1px solid #eee;flex-shrink:0}
.tab-btn{flex:1;height:48px;border:none;background:#fff;font-size:12px;color:#aaa;cursor:pointer;border-bottom:2px solid transparent;padding:0 2px}
.tab-btn.active{color:#555;border-bottom-color:#555}
.travel-wrap{width:100%;padding:0 24px;display:flex;flex-direction:column;flex:1}
.travel-section{width:100%;padding:16px 0}
.travel-section-title{font-size:14px;color:#999;margin-bottom:12px}
.dest-list{display:flex;flex-wrap:wrap;gap:8px}
.dest-item{padding:8px 20px;border-radius:6px;border:1px solid #ddd;background:#f8f8f8;font-size:14px;color:#555;cursor:pointer}
.dest-item.selected{background:#e8e8e8;border-color:#bbb}
.travel-lower{flex:1;display:flex;flex-direction:column;width:100%}
.travel-content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}
.travel-btns{width:100%;display:flex;gap:8px;justify-content:center;padding:8px 0 4px;flex-shrink:0}
.travel-btns .travel-btn{min-width:72px}
.travel-confirm-text{font-size:15px;color:#555;margin-bottom:16px}
.travel-btn{height:42px;padding:0 20px;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;background:#f0f0f0;color:#555;border:1px solid #ddd}
.travel-info{font-size:13px;color:#999;margin-bottom:12px;text-align:center}
.travel-info .val{color:#555;font-weight:600}
.travel-text-area{min-height:48px;text-align:center;margin-bottom:12px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.travel-text-area .line{font-size:13px;color:#888;line-height:1.8}
.combat-panel{display:flex;justify-content:space-between;width:100%;margin-bottom:12px;font-size:12px;color:#999}
.combat-side .val{color:#555;font-weight:600}
.combat-dmg-wrap{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}
.combat-dmg-lines{display:flex;flex-direction:column;align-items:center;font-size:13px;color:#888;line-height:1.8}
.repeat-badge{font-size:12px;color:#aaa;font-weight:600;white-space:nowrap}
.travel-end-msg{font-size:14px;color:#999;margin-top:8px}
#notifArea{position:fixed;top:12px;right:12px;z-index:900;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.notif{background:#fafafa;border:1px solid #e8e8e8;border-radius:6px;padding:6px 10px;font-size:12px;color:#666;display:inline-flex;align-items:center;gap:3px;opacity:1;transition:opacity .3s;align-self:flex-end}
.notif.fade-out{opacity:0}
.notif .base{font-weight:600;color:#555}
.notif .delta{display:inline-block;margin-left:3px}
.notif .delta.red{color:#c0392b;font-weight:600}
.notif .delta.green{color:#27ae60;font-weight:600}
.page-wrap{width:100%;max-width:420px;padding:0 16px;display:flex;flex-direction:column;flex:1;overflow-y:auto}
.section-title{font-size:14px;color:#999;margin:12px 0 8px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{aspect-ratio:1;border:1px solid #ddd;border-radius:4px;background:#fafafa;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:#888;cursor:pointer;position:relative;word-break:break-all;text-align:center;padding:2px}
.slot.has-item{background:#f4f4f4}
.slot .count{position:absolute;bottom:2px;right:4px;font-size:10px;color:#aaa}
.divider{width:100%;border:none;border-top:1px solid #ddd;margin:12px 0}
#modalOverlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.3);z-index:800;align-items:center;justify-content:center}
#modalOverlay.show{display:flex}
.modal-box{background:#fff;border-radius:8px;padding:20px;max-width:300px;width:90%;display:flex;flex-direction:column;gap:10px}
.modal-name{font-size:16px;font-weight:700;color:#444}
.modal-desc{font-size:13px;color:#888}
.modal-meta{font-size:12px;color:#aaa}
.modal-btns{display:flex;gap:8px;margin-top:4px}
.modal-btns .btn{flex:1}
.profile-wrap{width:100%;max-width:420px;padding:0 16px;display:flex;flex-direction:column;flex:1;overflow-y:auto}
.equip-area{padding:20px 0;text-align:center;color:#ccc;font-size:14px}
.attr-area{padding:0 0 24px}
.attr-title{font-size:14px;color:#999;margin-bottom:12px}
.attr-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:14px}
.attr-label{color:#888}
.attr-val{color:#555;font-weight:600}
.shop-header{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 0 8px;font-size:13px;color:#999}
.shop-header .val{color:#555;font-weight:600}
.craft-wrap{width:100%;max-width:420px;padding:0 16px;display:flex;flex-direction:column;flex:1;overflow-y:auto}
.craft-tabs{display:flex;border-bottom:1px solid #eee;margin-bottom:12px}
.craft-tab{flex:1;height:40px;border:none;background:#fff;font-size:13px;color:#aaa;cursor:pointer;border-bottom:2px solid transparent}
.craft-tab.active{color:#555;border-bottom-color:#555}
.recipe-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f0f0f0}
.recipe-slot{width:48px;height:48px;border:1px solid #ddd;border-radius:4px;background:#fafafa;display:flex;align-items:center;justify-content:center;font-size:10px;color:#888;text-align:center;word-break:break-all;padding:2px}
.recipe-info{flex:1;font-size:12px;color:#666}
.recipe-info .mat{color:#999}
.recipe-info .count{color:#aaa;font-size:11px}
.recipe-btn{height:32px;padding:0 12px;border:none;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;background:#f0f0f0;color:#555;border:1px solid #ddd}
.recipe-btn:disabled{opacity:0.4;cursor:not-allowed}
.craft-empty{font-size:13px;color:#ccc;text-align:center;padding:40px 0}
.codex-gold{border:2px solid #c9a96e !important}.codex-black{border:2px solid #333 !important}
</style>
</head>
<body>
<div id="notifArea"></div>
<div id="modalOverlay"><div class="modal-box" id="modalBox"></div></div>
<div class="page active" id="pageMain"><div class="container"><div class="top-bar"><div><span class="label">境界 </span><span class="val" id="stageNum">练气一阶</span></div><div><span class="label">修为 </span><span class="val" id="topExp">0</span></div></div><div class="stage-area"><div class="realm-name" id="realmName">练气一阶</div><div class="progress-section"><div class="progress-text">距离突破还需 <span class="pct" id="pctText">0%</span> <span class="exp" id="expText">(0 / 100)</span></div><div class="progress-bar-outer"><div class="progress-bar-inner" id="progressBar" style="width:0%"></div></div></div></div><div class="action-area"><div class="speed-info" id="speedInfo">待修炼</div><button class="btn btn-wide" id="btnCultivate">修 炼</button><button class="btn btn-wide btn-break" id="btnBreak">突 破</button></div></div></div>
<div class="page" id="pageTravel"><div class="travel-wrap"><div class="travel-section"><div class="travel-section-title">选择目的地</div><div class="dest-list" id="destList"><div class="dest-item" data-dest="grassland">草地</div></div></div><div class="travel-lower" id="travelLower"></div></div></div>
<div class="page" id="pageStorage"><div class="page-wrap" id="storageWrap"></div></div>
<div class="page" id="pageShop"><div class="page-wrap" id="shopWrap"></div></div>
<div class="page" id="pageCraft"><div class="craft-wrap" id="craftWrap"></div></div>
<div class="page" id="pageProfile"><div class="profile-wrap"><div class="equip-area">装备系统待开发</div><div class="craft-tabs" id="infoTabs"><button class="craft-tab active" data-tab="attr">属性</button><button class="craft-tab" data-tab="stats">统计</button><button class="craft-tab" data-tab="codex">图鉴</button></div><div id="infoContent"></div></div></div>
<div class="tab-bar"><button class="tab-btn active" data-page="pageMain">主界面</button><button class="tab-btn" data-page="pageTravel">游历</button><button class="tab-btn" data-page="pageStorage">存储</button><button class="tab-btn" data-page="pageShop">商店</button><button class="tab-btn" data-page="pageCraft">制作</button><button class="tab-btn" data-page="pageProfile">信息</button></div>
<script>
var SAVE_KEY='xiImmortalSave',SAVE_VER=3;
function saveGame(){var d={v:SAVE_VER,stageIdx:stageIdx,exp:exp,copper:copper,playerHP:playerHP,playerMaxHP:playerMaxHP,backpack:backpack,warehouse:warehouse,monsterKills:monsterKills,containerOwned:containerOwned,containerFemaleOwned:containerFemaleOwned,craftStats:craftStats,bonusHP:bonusHP,bonusATK:bonusATK,bonusDEF:bonusDEF};try{localStorage.setItem(SAVE_KEY,JSON.stringify(d));}catch(e){}}
function loadGame(){try{var s=localStorage.getItem(SAVE_KEY);if(!s)return false;var d=JSON.parse(s);if(!d)return false;stageIdx=d.stageIdx||0;exp=d.exp||0;copper=d.copper||0;playerHP=d.playerHP||50;playerMaxHP=d.playerMaxHP||50;backpack=d.backpack||[];warehouse=d.warehouse||[];monsterKills=d.monsterKills||{mosquito:0,mosquitoFemale:0};Object.keys(MONSTERS).forEach(function(k){if(!(k in monsterKills))monsterKills[k]=0;});containerOwned=d.containerOwned||false;containerFemaleOwned=d.containerFemaleOwned||false;craftStats=d.craftStats||{herbPill:{crafted:0,used:0}};Object.keys(RECIPES).forEach(function(k){if(!craftStats[k])craftStats[k]={crafted:0,used:0};});bonusHP=d.bonusHP||0;bonusATK=d.bonusATK||0;bonusDEF=d.bonusDEF||0;refreshMaxHP();return true;}catch(e){return false;}}
var ITEMS={faintSpirit:{name:'微弱灵气残影',desc:'弱小灵体在某处活动过的证据',quality:1,size:'迷你',maxStack:100,sellPrice:10,special:false,usable:true},mosquitoContainer:{name:'小雄蚊灵体容器',desc:'一个玻璃珠大小的金属球体，表面有着浅浅的纹路，散发着淡绿色的光，凑近听还有"嗡嗡"的声音。拥有后再击杀小雄蚊时，血量上限+1。(上限100)',quality:3,size:'中',maxStack:10,sellPrice:0,special:true},mosquitoFemaleContainer:{name:'小雌蚊灵体容器',desc:'一个玻璃珠大小的金属球体，表面有着浅浅的纹路，散发着淡粉色的光，凑近听还有"嗡~嗡~"的声音。拥有后再击杀小雌蚊时，吸血属性+0.01%。(上限1%)',quality:3,size:'中',maxStack:10,sellPrice:0,special:true},herb:{name:'灵草',desc:'稍微有些灵气沾染的草而已',quality:1,size:'迷你',maxStack:100,sellPrice:2,special:false,usable:false},herbPill:{name:'一品灵草丹',desc:'用灵草炼制的基础丹药，服用后增强体质',quality:1,size:'迷你',maxStack:100,sellPrice:null,special:false,usable:true}};
var RECIPES={herbPill:{resultId:'herbPill',materials:[{id:'herb',count:5}],successRate:1,maxCraft:10,maxUse:10,effects:{hpMax:1,atk:0.1,def:0.1}}};
var MONSTERS={mosquito:{name:'小雄蚊',hp:20,atk:5,def:0,expReward:5,loot:[{id:'faintSpirit',chance:0.1},{id:'mosquitoContainer',chance:0.001,special:true,perKillBonus:0.001}]},mosquitoFemale:{name:'小雌蚊',hp:15,atk:3,def:0,expReward:4,lifesteal:true,loot:[{id:'faintSpirit',chance:0.15},{id:'mosquitoFemaleContainer',chance:0.001,special:true,perKillBonus:0.001}]}};
var STAGES=['练气一阶','练气二阶','练气三阶','练气四阶','练气五阶','练气六阶','练气七阶','练气八阶','练气九阶'];
function reqFor(i){return(i+1)*100;}
var ATTRS=[{hp:50,atk:5,def:0,rec:0}];
var playerState='idle',stageIdx=0,exp=0,copper=0,expTimer=null,regenTimer=null;
var backpack=[],warehouse=[],BACKPACK_SLOTS=5,WAREHOUSE_SLOTS=20;
var playerHP=50,playerMaxHP=50,monsterKills={mosquito:0,mosquitoFemale:0};
var containerOwned=false,containerFemaleOwned=false,lastCombatLines=null,combatRepeat=0,defeatedInTravel=false;
var craftStats={herbPill:{crafted:0,used:0}},bonusHP=0,bonusATK=0,bonusDEF=0,infoTab='attr';
function getPctBonus(){return stageIdx;}
function getContainerHPBonus(){return containerOwned?Math.min(monsterKills.mosquito,100):0;}
function getEffectiveHP(){return Math.floor((ATTRS[0].hp+bonusHP)*(1+getPctBonus()/100))+getContainerHPBonus();}
function getEffectiveATK(){return((ATTRS[0].atk+bonusATK)*(1+getPctBonus()/100)).toFixed(2);}
function getEffectiveDEF(){return((ATTRS[0].def+bonusDEF)*(1+getPctBonus()/100)).toFixed(2);}
function getLifestealPct(){return containerFemaleOwned?Math.min(monsterKills.mosquitoFemale*0.0001,0.01):0;}
function refreshMaxHP(){var n=getEffectiveHP();if(n>playerMaxHP)playerHP+=n-playerMaxHP;playerMaxHP=n;if(playerHP>playerMaxHP)playerHP=playerMaxHP;}
var notifs={},$notifArea=document.getElementById('notifArea'),NOTIF_STAY=5000,MERGE_WAIT=1000;
function notifyChange(key,label,oldVal,newVal){var delta=newVal-oldVal;if(delta===0)return;var now=Date.now(),n=notifs[key];if(n&&(now-n.tLast)<MERGE_WAIT){n.merging=false;n.delta+=delta;n.tLast=now;var d=n.el.querySelector('.delta');if(d){d.className='delta '+(n.delta>0?'red':'green');d.textContent=(n.delta>0?'+':'')+n.delta;}var b=n.el.querySelector('.base');if(b)b.textContent=n.label+' '+n.base;return;}if(n&&n.el)n.el.remove();var el=document.createElement('div');el.className='notif';var c=delta>0?'red':'green';el.innerHTML='<span class="base">'+label+' '+oldVal+'</span><span class="delta '+c+'">'+(delta>0?'+':'')+delta+'</span>';$notifArea.appendChild(el);notifs[key]={label:label,base:oldVal,delta:delta,tCreate:now,tLast:now,el:el,merging:false};}
setInterval(function(){var now=Date.now(),keys=Object.keys(notifs);for(var i=0;i<keys.length;i++){var k=keys[i],n=notifs[k];if(!n)continue;if(!n.merging&&(now-n.tLast)>=MERGE_WAIT){n.merging=true;n.el.innerHTML='<span class="base">'+n.label+' '+(n.base+n.delta)+'</span>';}if(now-n.tCreate>=NOTIF_STAY){n.el.classList.add('fade-out');(function(nn,kk){setTimeout(function(){if(notifs[kk]===nn)delete notifs[kk];if(nn.el&&nn.el.parentNode)nn.el.remove();},300);})(n,k);}}},100);
function setExp(v){var o=exp;exp=v;if(o!==v){notifyChange('exp','修为',o,v);renderMain();saveGame();}}
function setCopper(v){var o=copper;copper=v;if(o!==v){notifyChange('copper','铜钱',o,v);renderMain();saveGame();}}
function fmtHP(v){return(Math.round(v*10)/10).toFixed(1);}
var $stageNum=document.getElementById('stageNum'),$topExp=document.getElementById('topExp'),$realmName=document.getElementById('realmName'),$pctText=document.getElementById('pctText'),$expText=document.getElementById('expText'),$progressBar=document.getElementById('progressBar'),$btnCult=document.getElementById('btnCultivate'),$btnBreak=document.getElementById('btnBreak'),$speedInfo=document.getElementById('speedInfo'),$travelLower=document.getElementById('travelLower'),$destList=document.getElementById('destList'),$storageWrap=document.getElementById('storageWrap'),$shopWrap=document.getElementById('shopWrap'),$craftWrap=document.getElementById('craftWrap'),$modalOverlay=document.getElementById('modalOverlay'),$modalBox=document.getElementById('modalBox');
function renderMain(){var max=stageIdx>=STAGES.length-1,req=max?0:reqFor(stageIdx),pct=max?100:Math.min(100,Math.floor(exp/req*100));$stageNum.textContent=STAGES[stageIdx];$topExp.textContent=exp;$realmName.textContent=STAGES[stageIdx];$pctText.textContent=pct+'%';$expText.textContent=max?'(已满)':'('+exp+' / '+req+')';$progressBar.style.width=pct+'%';if(!max&&exp>=req)$btnBreak.classList.add('show');else $btnBreak.classList.remove('show');var isC=playerState==='cultivating';$btnCult.className='btn btn-wide'+(isC?' active':'');if(playerState==='traveling'){$btnCult.textContent='游历中';$speedInfo.textContent='游历中无法修炼';}else{$btnCult.textContent=isC?'修炼中...':'修 炼';$speedInfo.textContent=isC?'每10秒修为 +10':'待修炼';}if(max){$btnCult.style.display='none';$btnBreak.classList.remove('show');$speedInfo.textContent='练气已圆满';}else $btnCult.style.display='';renderAttrArea();}
function renderAttrArea(){renderInfo();}
function renderInfo(){var el=document.getElementById('infoContent');if(!el)return;if(infoTab==='attr')renderAttrTab(el);else if(infoTab==='stats')renderStatsTab(el);else if(infoTab==='codex')renderCodexTab(el);}
function renderAttrTab(el){var pct=getPctBonus(),hpFlat=getContainerHPBonus(),ls=getLifestealPct();var h='<div class="attr-title">人物属性</div>';h+='<div class="attr-row"><span class="attr-label">血量</span><span class="attr-val">'+fmtHP(playerHP)+'/'+fmtHP(playerMaxHP)+' (+'+pct+'%'+(hpFlat>0?'+'+hpFlat:'')+')</span></div>';h+='<div class="attr-row"><span class="attr-label">攻击</span><span class="attr-val">'+getEffectiveATK()+' (+'+pct+'%)</span></div>';h+='<div class="attr-row"><span class="attr-label">防御</span><span class="attr-val">'+getEffectiveDEF()+' (+'+pct+'%)</span></div>';h+='<div class="attr-row"><span class="attr-label">自然恢复</span><span class="attr-val">'+ATTRS[0].rec+'</span></div>';h+='<div class="attr-row"><span class="attr-label">吸血</span><span class="attr-val">'+(ls*100).toFixed(2)+'%</span></div>';el.innerHTML=h;}
function renderStatsTab(el){var h='<div class="attr-title">击杀统计</div>',any=false;Object.keys(MONSTERS).forEach(function(k){var c=monsterKills[k]||0;if(c>0){h+='<div class="attr-row"><span class="attr-label">'+MONSTERS[k].name+'</span><span class="attr-val">'+c+'只</span></div>';any=true;}});if(!any)h+='<div style="color:#ccc;font-size:13px;padding:20px 0;text-align:center">暂无击杀记录</div>';el.innerHTML=h;}
function renderCodexTab(el){var list=[{id:'mosquitoContainer',source:'小雄蚊掉落',effect:'击杀小雄蚊时，血量上限+1',max:100,getV:function(){return Math.min(monsterKills.mosquito,100);}},{id:'mosquitoFemaleContainer',source:'小雌蚊掉落',effect:'击杀小雌蚊时，吸血属性+0.01%',max:100,getV:function(){return Math.min(monsterKills.mosquitoFemale,100);}}];var h='<div class="attr-title">图鉴</div><div class="grid">';for(var i=0;i<list.length;i++){var s=list[i],it=ITEMS[s.id],owned=(s.id==='mosquitoContainer')?containerOwned:containerFemaleOwned;h+='<div class="slot has-item'+(function(){var complete=owned&&(s.getV()>=s.max);return complete?' codex-black':(owned?' codex-gold':'');})()+'" data-ci="'+i+'">'+it.name+'</div>';}h+='</div>';el.innerHTML=h;el.querySelectorAll('.slot').forEach(function(slot){slot.addEventListener('click',function(){var idx=parseInt(slot.getAttribute('data-ci')),s=list[idx],it=ITEMS[s.id],owned=(s.id==='mosquitoContainer')?containerOwned:containerFemaleOwned,mh='<div class="modal-name">'+it.name+'</div><div class="modal-meta">来源：'+s.source+'</div><div class="modal-meta">效果：'+s.effect+'</div>';if(owned)mh+='<div class="modal-desc">'+it.desc+'</div><div class="modal-meta">进度：'+s.getV()+'/'+s.max+'</div>';mh+='<div class="modal-btns"><button class="btn btn-sm" id="mbClose">关闭</button></div>';$modalBox.innerHTML=mh;$modalOverlay.classList.add('show');document.getElementById('mbClose').addEventListener('click',closeModal);});});}

function removeOne(arr,id){var idx=findSlot(arr,id);if(idx<0)return false;arr[idx].count-=1;if(arr[idx].count<=0)arr.splice(idx,1);return true;}
function removeItems(arr,id,count){var idx=findSlot(arr,id);if(idx<0)return false;if(arr[idx].count<count)return false;arr[idx].count-=count;if(arr[idx].count<=0)arr.splice(idx,1);return true;}

function showEncounter(){travelMsgLines=['是微弱灵气残影，吸收后可增加5%当前修为(上限为100)'];$travelLower.querySelector('.travel-content').innerHTML='<div class="travel-info">'+buildTravelInfo()+'</div><div class="progress-section"><div class="progress-text">游历进度 <span class="pct">'+travelProg+'%</span></div><div class="progress-bar-outer"><div class="progress-bar-inner" style="width:'+travelProg+'%"></div></div></div><div class="combat-panel">'+buildCombatPanel()+'</div><div class="travel-text-area"><div class="line">'+travelMsgLines[0]+'</div></div><div style="display:flex;gap:8px;justify-content:center;margin-top:8px"><button class="travel-btn" id="btnAbsorb">吸收</button><button class="travel-btn" id="btnStore">收纳</button></div>';var $tb=$travelLower.querySelector('.travel-btns');if($tb)$tb.style.display='none';document.getElementById('btnAbsorb').addEventListener('click',function(){var bonus=Math.min(100,Math.floor(exp*0.05));setExp(exp+bonus);travelMsgLines=['吸收了微弱灵气残影，修为+'+bonus];if($tb)$tb.style.display='';renderTravelLower();});document.getElementById('btnStore').addEventListener('click',function(){if(addItem(backpack,'faintSpirit',BACKPACK_SLOTS))travelMsgLines=['将微弱灵气残影收入背包'];else travelMsgLines=['背包已满，请先整理背包'];if($tb)$tb.style.display='';renderTravelLower();});}
function startCombat(monsterKey){var om=MONSTERS[monsterKey],m={name:om.name,hp:om.hp,atk:om.atk,def:om.def,expReward:om.expReward,lifesteal:om.lifesteal||false,loot:om.loot,key:monsterKey};inCombat=true;enemyData=m;enemyHP=m.hp;lastCombatLines=null;combatRepeat=0;renderTravelLower();setTravelMsg([m.name+'出现了！',m.name+'：嗡~嗡~~']);}
function rollLoot(m){var msgs=[];for(var i=0;i<m.loot.length;i++){var l=m.loot[i],rate=l.chance,owned=l.special?((l.id==='mosquitoContainer')?containerOwned:containerFemaleOwned):false;if(l.special&&owned)continue;if(l.perKillBonus)rate+=monsterKills[m.key]*l.perKillBonus;if(Math.random()<rate){if(l.special){if(l.id==='mosquitoContainer')containerOwned=true;if(l.id==='mosquitoFemaleContainer')containerFemaleOwned=true;refreshMaxHP();msgs.push('获得特殊战利品：'+ITEMS[l.id].name+'，图鉴已点亮');}else{if(addItem(backpack,l.id,BACKPACK_SLOTS))msgs.push('获得：'+ITEMS[l.id].name);else msgs.push('背包已满，'+ITEMS[l.id].name+'掉落丢失');}}}return msgs;}
function doAttack(){if(!inCombat||!enemyData)return;var pAtk=parseFloat(getEffectiveATK()),pDef=parseFloat(getEffectiveDEF()),pDmg=Math.max(0,pAtk-enemyData.def);enemyHP-=pDmg;var lines=['你对'+enemyData.name+'造成'+pDmg+'点伤害'];if(enemyHP<=0){enemyHP=0;monsterKills[enemyData.key]=(monsterKills[enemyData.key]||0)+1;refreshMaxHP();var ls2=getLifestealPct();if(ls2>0&&pDmg>0)playerHP=Math.min(playerMaxHP,playerHP+Math.floor(pDmg*ls2));lines.push('获得'+enemyData.expReward+'修为，已击败'+enemyData.name+monsterKills[enemyData.key]+'只');setExp(exp+enemyData.expReward);lines=lines.concat(rollLoot(enemyData));inCombat=false;enemyData=null;lastCombatLines=null;combatRepeat=0;setTravelMsg(lines);renderTravelLower();saveGame();return;}var eDmg=Math.max(0,enemyData.atk-pDef);playerHP-=eDmg;if(enemyData.lifesteal&&eDmg>0)playerHP=Math.min(playerMaxHP,playerHP+eDmg);var ls=getLifestealPct();if(ls>0&&pDmg>0)playerHP=Math.min(playerMaxHP,playerHP+Math.floor(pDmg*ls));lines.push(enemyData.name+'对你造成'+eDmg+'点伤害');if(enemyData.lifesteal&&eDmg>0)lines.push(enemyData.name+'恢复了'+eDmg+'点血量');if(lastCombatLines&&lines.length===lastCombatLines.length&&lines[lines.length-1]===lastCombatLines[lastCombatLines.length-1])combatRepeat++;else{lastCombatLines=lines.slice();combatRepeat=1;}if(playerHP<=0){playerHP=1;inCombat=false;enemyData=null;lastCombatLines=null;combatRepeat=0;defeatedInTravel=true;setTravelMsg(['体力耗尽了，先回去休息一下吧']);renderTravelLower();saveGame();return;}setTravelMsg(lines);}
function doFlee(){if(!inCombat)return;inCombat=false;enemyData=null;lastCombatLines=null;combatRepeat=0;clearTravelMsg();renderTravelLower();}
function doReturn(){var wd=defeatedInTravel;playerState='idle';travelProg=0;travelDist=0;travelExplores=0;inCombat=false;enemyData=null;lastCombatLines=null;combatRepeat=0;defeatedInTravel=false;selectedDest=null;$destList.querySelectorAll('.dest-item').forEach(function(d){d.classList.remove('selected');});clearTravelMsg();renderTravelLower();renderMain();if(wd)setTimeout(function(){startCultivate();},100);}
loadGame();refreshMaxHP();renderMain();renderTravelLower();renderStorage();renderShop();renderCraft();renderInfo();
</script>
</body>
